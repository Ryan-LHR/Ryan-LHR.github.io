{% if site.google_scholar_stats_use_cdn %}
{% assign gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/' | append: site.repository | append: '@' %}
{% else %}
{% assign gsDataBaseUrl = 'https://raw.githubusercontent.com/' | append: site.repository | append: '/' %}
{% endif %}
<script src="{{ '/assets/js/scholar-citations.js' | relative_url }}" defer
        data-stats-url="{{ gsDataBaseUrl }}google-scholar-stats/gs_data.json"
        data-fallback-url="{{ '/assets/data/google-scholar-stats.json' | relative_url }}"
        data-scholar-url="{{ site.author.googlescholar | escape }}"></script>
